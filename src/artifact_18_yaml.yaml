version: '3.8'

services:
  solana-credit-telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solana_credit_worker
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=${SOLANA_RPC_URL}
      - PROGRAM_ID=${PROGRAM_ID}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - OPS_SLACK_WEBHOOK=${OPS_SLACK_WEBHOOK}
      - OPERATIONS_EMAIL=${OPERATIONS_EMAIL}
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"