version: '3.8'

services:
  credit-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solana_tokenization_supercycle
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Cred1tSupercyc1e111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY:-re_mock_key_000000}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-https://api.example.com/webhooks/alerts/placeholder
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3