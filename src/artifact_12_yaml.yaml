version: '3.8'

services:
  solarisfi-daemon:
    build: .
    container_name: solarisfi-servicer-agent
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com/
      - PROGRAM_ID=SoL1111111111111111111111111111111111111112
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - AUDIT_EMAIL_TO=${AUDIT_EMAIL_TO}
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"