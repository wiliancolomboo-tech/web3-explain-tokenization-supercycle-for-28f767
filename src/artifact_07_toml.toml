[package]
name = "rwa_compliance_hook"
version = "0.1.0"
description = "Token-2022 Transfer Hook for Institutional KYC & OFAC Compliance"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rwa_compliance_hook"

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
spl-token-2022 = { version = "0.13.0", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "0.6.3"